<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650"><rect width="1000" height="650" fill="#1a1916"/><g fill="#e6d5b8" font-family="monospace" font-size="18"><text x="30" y="40">1280 / desktop — Task manager</text><rect x="30" y="70" width="190" height="340" rx="4" fill="#24221e" stroke="#ff8303"/><text x="45" y="105">Lists / +</text><text x="45" y="150">Inbox (3)</text><text x="45" y="190">Study (2)</text><rect x="240" y="70" width="370" height="340" rx="4" fill="#24221e" stroke="#ff8303"/><text x="260" y="105">Study / rename / delete</text><text x="260" y="155">+ Add task</text><text x="260" y="205">Search / filters</text><text x="260" y="255">□ Task title   2/3</text><rect x="630" y="70" width="340" height="340" rx="4" fill="#24221e" stroke="#ff8303"/><text x="650" y="105">Task card / close</text><text x="650" y="150">Title / description</text><text x="650" y="195">Progress 2 of 3</text><text x="650" y="240">☑ Subtask</text><text x="30" y="460">360 / mobile: menu toggles sidebar; task card fills viewport.</text><text x="30" y="505">768 / tablet: sidebar + list; card fills viewport.</text><text x="30" y="550">Empty: create first list / add first task.</text><text x="30" y="590">Search empty: reset search. Light: warm paper + dark brown.</text></g></svg>
