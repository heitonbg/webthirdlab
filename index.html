<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1916" />
    <meta name="description" content="Менеджер задач: списки, подзадачи, поиск и темы. Лабораторная работа №3 на React." />
    <title>Список дел — менеджер задач</title>
    <script>
      (() => {
        let theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        try {
          const saved = JSON.parse(localStorage.getItem('todo-app:theme'));
          if (saved === 'light' || saved === 'dark') theme = saved;
        } catch { /* При недоступном хранилище остаётся системная тема. */ }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
